on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          release-type: simple

  publish-image:
    name: Publish release image
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: cluster-autoscaler-provider
      IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/cluster-autoscaler-provider
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ env.IMAGE_NAME }}
        uses: ./.github/actions/build-oci-package
        with:
          name: ${{ env.IMAGE_NAME }}
          version: ${{ env.RELEASE_TAG }}
          disable-artifact: true
          load-docker: true

      - name: Upload to GHCR
        run: |
          docker tag "tkhq/${IMAGE_NAME}:latest" "${IMAGE_REPO}:${RELEASE_TAG}"
          docker tag "tkhq/${IMAGE_NAME}:latest" "${IMAGE_REPO}:latest"
          docker image push --all-tags "${IMAGE_REPO}"
